name: Generate and Upload LeetCode Dataset

on:
  schedule:
    - cron: "0 0 * * 0" # Runs at 00:00 UTC every Sunday
  workflow_dispatch: # Allows manual triggering

jobs:
  generate-dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout generator repository
        uses: actions/checkout@v7
        with:
          repository: olegshulyakov/leetcode-dataset-generator
          path: generator

      - name: Checkout LeetCode repository
        uses: actions/checkout@v7
        with:
          repository: doocs/leetcode
          path: leetcode-repo

      - name: Set up commit message
        id: commit-msg
        run: |
          sources="doocs@$(git -C leetcode-repo rev-parse --short HEAD), generator@$(git -C generator rev-parse --short HEAD)"
          echo "sources=$sources" >> $GITHUB_OUTPUT
          echo "msg=$(date +'Update %Y-%m-%d') ($sources)" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install to Hugging Face CLI
        run: pip install huggingface_hub

      - name: Check for upstream changes
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          SOURCES: ${{ steps.commit-msg.outputs.sources }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          last = HfApi().list_repo_commits(os.environ["HF_REPO_ID"], repo_type="dataset")[0].title
          skip = os.environ["SOURCES"] in last
          print(f"Last commit: {last!r}; skip: {skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"skip={str(skip).lower()}\n")
          EOF

      - name: Set up Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: generator/go.sum

      - name: Build Go application
        if: steps.check.outputs.skip != 'true'
        run: |
          cd generator
          go build -o leetcode-dataset

      - name: Generate dataset
        if: steps.check.outputs.skip != 'true'
        run: |
          generate() { ./generator/leetcode-dataset --repo=leetcode-repo --description-format=markdown --max-failures=50 "$@"; }
          generate --output=solutions-train --split=train --min-records=19000
          generate --output=solutions-test --split=test --min-records=500
          generate --output=problems-train --split=train --layout=problems --min-records=3000
          generate --output=problems-test --split=test --layout=problems --min-records=100

      - name: Prepare upload folder
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p upload
          cp generator/dataset/README.md upload/README.md
          for split in train test; do
            mkdir -p upload/default/$split upload/problems/$split
            cp solutions-$split.parquet upload/default/$split/0000.parquet
            cp problems-$split.parquet upload/problems/$split/0000.parquet
          done

      - name: Upload Dataset to Hugging Face
        if: steps.check.outputs.skip != 'true'
        run: hf upload --repo-type dataset --commit-message "${{ steps.commit-msg.outputs.msg }}" --token "${{ secrets.HF_TOKEN }}" "${{ secrets.HF_REPO_ID }}" upload .
